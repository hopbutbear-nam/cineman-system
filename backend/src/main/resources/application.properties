spring.application.name=cineman-backend
server.port=8080

# ---- MySQL 8.0 (doi bang bien moi truong DB_USERNAME / DB_PASSWORD hoac sua truc tiep) ----
spring.datasource.url=jdbc:mysql://localhost:3306/cineman?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=1111

# ---- JPA: schema do database/schema.sql quan ly, Hibernate khong tu tao/sua bang ----
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# ---- Jackson ----
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.default-property-inclusion=always

# ---- CineMan ----
cineman.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
cineman.auth.token-ttl-minutes=480
